<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Breed Classifier & Analytics</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .upload-section {
            display: flex;
            gap: 10px;
            justify-content: center;
            padding: 20px;
            background: #e9ecef;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        input[type="file"] {
            padding: 8px;
        }

        button {
            padding: 10px 25px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #218838;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
        }

        h3 {
            margin-top: 0;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
            font-size: 1.1rem;
        }

        pre {
            background: #2d3436;
            color: #dfe6e9;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            max-height: 250px;
            overflow-y: auto;
            direction: ltr;
        }

        .chart-container {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #chartWrapper {
            width: 100%;
            max-width: 450px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Pet Breed Classifier</h1>

    <div class="upload-section">
        <input type="file" id="fileInput" accept="image/*">
        <button onclick="uploadAndRefresh()">Classify & Analyze</button>
    </div>

    <div class="main-grid">
        <div class="card">
            <h3>Latest Prediction</h3>
            <pre id="predictionResult">No scan performed yet...</pre>
        </div>

        <div class="card">
            <h3>Analytics Data</h3>
            <pre id="stats">Analytics will appear here...</pre>
        </div>
    </div>

   <div class="card" id="feedback-area">
    <h3>Feedback</h3>
    <p>Was this prediction correct?</p>
    <button onclick="sendFeedback(true)">Yes</button>
    <button onclick="toggleCorrectionInput()">No, it wasn't</button>
    
    <div id="correctionBox" style="display:none; margin-top: 10px;">
        <input type="text" id="correctionText" placeholder="Enter correct breed">
        <button onclick="sendFeedback(false)">Submit</button>
    </div>
    </div>

    <div class="chart-container card">
        <h3>Breed Distribution</h3>
        <div id="chartWrapper">
            <canvas id="breedChart"></canvas>
        </div>
    </div>
</div>

<script>
    let myChart = null; 
    let lastProcessedFile = ""

    // Handle image upload and update results on the page
    async function uploadAndRefresh() {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files[0]) return alert("Please select an image!");

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            
            // Send image to backend and show result
            const resPredict = await fetch('/predict', { method: 'POST', body: formData });
            const dataPredict = await resPredict.json();
            
            lastProcessedFile = dataPredict.filename;
            
            document.getElementById('predictionResult').innerText = JSON.stringify(dataPredict, null, 2);

            // Fetch and show updated analytics
            const resStats = await fetch('/analytics');
            const dataStats = await resStats.json();
            document.getElementById('stats').innerText = JSON.stringify(dataStats, null, 2);

            updateChart(dataStats.breed_distribution);

        } 
        
        catch (error) {
            console.error("Error:", error);
            alert("Something went wrong with the server.");
        }
    }

    // Create or update the pie chart using Chart.js
    function updateChart(distributionData) {
        const ctx = document.getElementById('breedChart').getContext('2d');

        // Destroy existing chart so we don't have overlapping graphics
        if (myChart) {
            myChart.destroy();
        }

        const labels = Object.keys(distributionData);
        const values = Object.values(distributionData);

        myChart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Number of Scans',
                    data: values,
                    backgroundColor: [
                        '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', 
                        '#9966FF', '#FF9F40', '#2ecc71', '#e67e22'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                    }
                }
            }
        });
    }

    // Show the correction input field
    function toggleCorrectionInput() {
        document.getElementById('correctionBox').style.display = 'block';
    }

    // Send user feedback back to the server
    async function sendFeedback(isCorrect) {
        const filename = lastProcessedFile; 
        
        if (!filename) {
            alert("No prediction found to give feedback on!");
            return;
        }

        // Determine correction text based on user choice
        const correction = isCorrect ? "Correct" : document.getElementById('correctionText').value;

        const response = await fetch('/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                filename: filename,
                correction: correction
            })
        });

        if (response.ok) {
            alert("Thank you for your feedback!");
            document.getElementById('feedback-area').innerHTML = "<p>Feedback saved!</p>";
        } else {
            alert("Error saving feedback.");
        }
    }

</script>

</body>
</html>
